<!-- @dsCard group="Colors" viewport="700x180" name="Backdrops" subtitle="Glass needs something to refract — three stand-in gradients for photography" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font: var(--type-body); }
  .card { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .lbl { font: var(--type-caption); letter-spacing: var(--tracking-caption); text-transform: uppercase; color: var(--text-muted); }
  .mono { font: var(--type-meta); color: var(--text-secondary); }
  .sw { width: 78px; display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 54px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--border-hairline); }
  .stage { border-radius: var(--radius-lg); padding: 22px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .dusk { background: var(--backdrop-dusk); }
  .interior { background: var(--backdrop-interior); }
  
</style></head><body>
<div class="card" style="flex-direction:row;gap:12px">
<div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:104px;border-radius:var(--radius-md);background:var(--backdrop-dusk)"></div><span class="lbl">dusk</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:104px;border-radius:var(--radius-md);background:var(--backdrop-interior)"></div><span class="lbl">interior</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:104px;border-radius:var(--radius-md);background:var(--backdrop-studio)"></div><span class="lbl">studio</span></div>
</div></body></html>
