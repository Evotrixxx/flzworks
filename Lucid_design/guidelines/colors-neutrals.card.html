<!-- @dsCard group="Colors" viewport="700x150" name="Warm neutral ramp" subtitle="One warm ramp from near-black ink to cream — the whole system's structure" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font: var(--type-body); }
  .card { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .lbl { font: var(--type-caption); letter-spacing: var(--tracking-caption); text-transform: uppercase; color: var(--text-muted); }
  .mono { font: var(--type-meta); color: var(--text-secondary); }
  .sw { width: 78px; display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 54px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--border-hairline); }
  .stage { border-radius: var(--radius-lg); padding: 22px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .dusk { background: var(--backdrop-dusk); }
  .interior { background: var(--backdrop-interior); }
  
</style></head><body>
<div class="card"><div class="row">
<div class="sw"><div class="chip" style="background:var(--ink-900)"></div><span class="lbl">ink-900</span><span class="mono" style="font-size:9px">#14120F</span></div><div class="sw"><div class="chip" style="background:var(--ink-700)"></div><span class="lbl">ink-700</span><span class="mono" style="font-size:9px">#2C2925</span></div><div class="sw"><div class="chip" style="background:var(--ink-600)"></div><span class="lbl">ink-600</span><span class="mono" style="font-size:9px">#413C36</span></div><div class="sw"><div class="chip" style="background:var(--stone-500)"></div><span class="lbl">stone-500</span><span class="mono" style="font-size:9px">#6B6158</span></div><div class="sw"><div class="chip" style="background:var(--stone-300)"></div><span class="lbl">stone-300</span><span class="mono" style="font-size:9px">#A99E92</span></div><div class="sw"><div class="chip" style="background:var(--sand-200)"></div><span class="lbl">sand-200</span><span class="mono" style="font-size:9px">#C9BFB3</span></div><div class="sw"><div class="chip" style="background:var(--sand-100)"></div><span class="lbl">sand-100</span><span class="mono" style="font-size:9px">#DED6CA</span></div><div class="sw"><div class="chip" style="background:var(--cream-50)"></div><span class="lbl">cream-50</span><span class="mono" style="font-size:9px">#F1EBE2</span></div><div class="sw"><div class="chip" style="background:var(--cream-25)"></div><span class="lbl">cream-25</span><span class="mono" style="font-size:9px">#FAF6F0</span></div>
</div></div></body></html>
