<!-- @dsCard group="Type" viewport="700x180" name="Mono labels" subtitle="IBM Plex Mono, uppercase, 0.14–0.18em tracking — the system's signature texture" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font: var(--type-body); }
  .card { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .lbl { font: var(--type-caption); letter-spacing: var(--tracking-caption); text-transform: uppercase; color: var(--text-muted); }
  .mono { font: var(--type-meta); color: var(--text-secondary); }
  .sw { width: 78px; display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 54px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--border-hairline); }
  .stage { border-radius: var(--radius-lg); padding: 22px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .dusk { background: var(--backdrop-dusk); }
  .interior { background: var(--backdrop-interior); }
  
</style></head><body>
<div class="card">
<span style="font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase">Classic hoodie / by lucid studio</span>
<span style="font:var(--type-meta);color:var(--text-secondary)">--type-meta · 11px · specs, prices, counts</span>
<span style="font:var(--type-caption);letter-spacing:var(--tracking-caption);text-transform:uppercase;color:var(--text-muted)">Caption · 9px · ring labels &amp; corner marks</span>
<span class="mono">Labels never exceed 4 words and never sentence-case.</span>
</div></body></html>
