<!-- @dsCard group="Spacing" viewport="700x150" name="Control heights" subtitle="30 / 38 / 48px — everything interactive lands on one of three heights" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font: var(--type-body); }
  .card { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .lbl { font: var(--type-caption); letter-spacing: var(--tracking-caption); text-transform: uppercase; color: var(--text-muted); }
  .mono { font: var(--type-meta); color: var(--text-secondary); }
  .sw { width: 78px; display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 54px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--border-hairline); }
  .stage { border-radius: var(--radius-lg); padding: 22px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .dusk { background: var(--backdrop-dusk); }
  .interior { background: var(--backdrop-interior); }
  
</style></head><body>
<div class="card"><div class="row" style="gap:16px">
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="height:30px;padding:0 14px;border-radius:999px;background:var(--ink-900);color:var(--cream-25);display:flex;align-items:center;font:var(--type-button)">Action</div><span class="lbl">sm · 30px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="height:38px;padding:0 20px;border-radius:999px;background:var(--ink-900);color:var(--cream-25);display:flex;align-items:center;font:var(--type-button)">Action</div><span class="lbl">md · 38px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="height:48px;padding:0 28px;border-radius:999px;background:var(--ink-900);color:var(--cream-25);display:flex;align-items:center;font:var(--type-button)">Action</div><span class="lbl">lg · 48px</span></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:48px;height:48px;border-radius:999px;background:var(--ink-900)"></div><span class="lbl">icon lg</span></div>
</div></div></body></html>
