<!-- @dsCard group="Spacing" viewport="700x170" name="Radii" subtitle="Pill is the default for controls; panels use 16–32px" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font: var(--type-body); }
  .card { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .lbl { font: var(--type-caption); letter-spacing: var(--tracking-caption); text-transform: uppercase; color: var(--text-muted); }
  .mono { font: var(--type-meta); color: var(--text-secondary); }
  .sw { width: 78px; display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 54px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--border-hairline); }
  .stage { border-radius: var(--radius-lg); padding: 22px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .dusk { background: var(--backdrop-dusk); }
  .interior { background: var(--backdrop-interior); }
  
</style></head><body>
<div class="card"><div class="row" style="gap:14px">
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:80px;height:56px;background:var(--sand-100);border-radius:var(--radius-xs);box-shadow:inset 0 0 0 1px var(--border-hairline)"></div><span class="lbl">6</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:80px;height:56px;background:var(--sand-100);border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px var(--border-hairline)"></div><span class="lbl">10</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:80px;height:56px;background:var(--sand-100);border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--border-hairline)"></div><span class="lbl">16</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:80px;height:56px;background:var(--sand-100);border-radius:var(--radius-lg);box-shadow:inset 0 0 0 1px var(--border-hairline)"></div><span class="lbl">24</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:80px;height:56px;background:var(--sand-100);border-radius:var(--radius-xl);box-shadow:inset 0 0 0 1px var(--border-hairline)"></div><span class="lbl">32</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:80px;height:56px;background:var(--sand-100);border-radius:var(--radius-pill);box-shadow:inset 0 0 0 1px var(--border-hairline)"></div><span class="lbl">pill</span></div>
</div></div></body></html>
