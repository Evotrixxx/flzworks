<!-- @dsCard group="Type" viewport="700x170" name="Numerals" subtitle="Display-weight figures with a mono superscript unit" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font: var(--type-body); }
  .card { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .lbl { font: var(--type-caption); letter-spacing: var(--tracking-caption); text-transform: uppercase; color: var(--text-muted); }
  .mono { font: var(--type-meta); color: var(--text-secondary); }
  .sw { width: 78px; display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 54px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--border-hairline); }
  .stage { border-radius: var(--radius-lg); padding: 22px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .dusk { background: var(--backdrop-dusk); }
  .interior { background: var(--backdrop-interior); }
  
</style></head><body>
<div class="card"><div class="row" style="gap:40px;align-items:flex-start">
<div style="display:flex;flex-direction:column;gap:6px"><span class="lbl">Overall balance</span><span style="font:var(--type-numeric-xl);letter-spacing:var(--tracking-display);display:flex;align-items:flex-start">990,815<sup style="font:var(--type-meta);margin-top:4px;opacity:.7">$</sup></span></div><div style="display:flex;flex-direction:column;gap:6px"><span class="lbl">Monthly profits</span><span style="font:var(--type-numeric-xl);letter-spacing:var(--tracking-display);display:flex;align-items:flex-start">170,520<sup style="font:var(--type-meta);margin-top:4px;opacity:.7">$</sup></span></div><div style="display:flex;flex-direction:column;gap:6px"><span class="lbl">Support</span><span style="font:var(--type-numeric-xl);letter-spacing:var(--tracking-display);display:flex;align-items:flex-start">80<sup style="font:var(--type-meta);margin-top:4px;opacity:.7">%</sup></span></div>
</div></div></body></html>
