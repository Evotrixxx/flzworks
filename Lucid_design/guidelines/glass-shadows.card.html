<!-- @dsCard group="Glass" viewport="700x180" name="Cast shadows" subtitle="Long, soft, warm-black — never neutral grey" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font: var(--type-body); }
  .card { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .lbl { font: var(--type-caption); letter-spacing: var(--tracking-caption); text-transform: uppercase; color: var(--text-muted); }
  .mono { font: var(--type-meta); color: var(--text-secondary); }
  .sw { width: 78px; display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 54px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--border-hairline); }
  .stage { border-radius: var(--radius-lg); padding: 22px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .dusk { background: var(--backdrop-dusk); }
  .interior { background: var(--backdrop-interior); }
  
</style></head><body>
<div class="card" style="background:var(--surface-page)"><div class="row" style="gap:22px;padding:10px 4px 22px">
<div style="display:flex;flex-direction:column;gap:10px;align-items:center"><div style="width:120px;height:64px;border-radius:var(--radius-md);background:var(--white);box-shadow:var(--shadow-sm)"></div><span class="lbl">sm</span></div><div style="display:flex;flex-direction:column;gap:10px;align-items:center"><div style="width:120px;height:64px;border-radius:var(--radius-md);background:var(--white);box-shadow:var(--shadow-md)"></div><span class="lbl">md</span></div><div style="display:flex;flex-direction:column;gap:10px;align-items:center"><div style="width:120px;height:64px;border-radius:var(--radius-md);background:var(--white);box-shadow:var(--shadow-lg)"></div><span class="lbl">lg</span></div><div style="display:flex;flex-direction:column;gap:10px;align-items:center"><div style="width:120px;height:64px;border-radius:var(--radius-md);background:var(--white);box-shadow:var(--shadow-float)"></div><span class="lbl">float</span></div>
</div></div></body></html>
