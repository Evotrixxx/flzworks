<!-- @dsCard group="Glass" viewport="700x210" name="Edge, inner glow, specular" subtitle="Three stacked effects are what make a panel read as thick glass" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font: var(--type-body); }
  .card { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .lbl { font: var(--type-caption); letter-spacing: var(--tracking-caption); text-transform: uppercase; color: var(--text-muted); }
  .mono { font: var(--type-meta); color: var(--text-secondary); }
  .sw { width: 78px; display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 54px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--border-hairline); }
  .stage { border-radius: var(--radius-lg); padding: 22px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .dusk { background: var(--backdrop-dusk); }
  .interior { background: var(--backdrop-interior); }
  
</style></head><body>
<div class="card"><div class="stage dusk">
<div style="position:relative;flex:1;height:120px;border-radius:var(--radius-lg);overflow:hidden;background:var(--glass-light);border:var(--glass-edge-light);box-shadow:var(--shadow-md),none;backdrop-filter:var(--glass-blur-lg);-webkit-backdrop-filter:var(--glass-blur-lg)"><span style="position:absolute;bottom:14px;left:14px;font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase">edge only</span></div><div style="position:relative;flex:1;height:120px;border-radius:var(--radius-lg);overflow:hidden;background:var(--glass-light);border:var(--glass-edge-light);box-shadow:var(--shadow-md),var(--glass-inner-light);backdrop-filter:var(--glass-blur-lg);-webkit-backdrop-filter:var(--glass-blur-lg)"><span style="position:absolute;bottom:14px;left:14px;font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase">+ inner glow</span></div><div style="position:relative;flex:1;height:120px;border-radius:var(--radius-lg);overflow:hidden;background:var(--glass-light);border:var(--glass-edge-light);box-shadow:var(--shadow-md),var(--glass-inner-light);backdrop-filter:var(--glass-blur-lg);-webkit-backdrop-filter:var(--glass-blur-lg)"><span style="position:absolute;inset:0;background:var(--glass-specular);mix-blend-mode:screen"></span><span style="position:absolute;bottom:14px;left:14px;font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase">+ specular</span></div>
</div></div></body></html>
