<!-- @dsCard group="Brand" viewport="700x170" name="Wordmark (type only)" subtitle="No logo was supplied — the mark is the name set in Archivo 800 with a registered dot" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font: var(--type-body); }
  .card { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .lbl { font: var(--type-caption); letter-spacing: var(--tracking-caption); text-transform: uppercase; color: var(--text-muted); }
  .mono { font: var(--type-meta); color: var(--text-secondary); }
  .sw { width: 78px; display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 54px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--border-hairline); }
  .stage { border-radius: var(--radius-lg); padding: 22px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .dusk { background: var(--backdrop-dusk); }
  .interior { background: var(--backdrop-interior); }
  
</style></head><body>
<div class="card" style="gap:18px">
<div style="display:flex;align-items:flex-start;gap:3px;font:800 40px/1 var(--font-display);letter-spacing:-0.04em">LUCID<sup style="font:var(--type-caption);margin-top:6px">®</sup></div>
<div style="display:flex;gap:12px;align-items:center">
<span style="display:flex;align-items:center;height:34px;padding:0 16px;border-radius:999px;background:var(--ink-900);color:var(--cream-25);font:700 15px/1 var(--font-display);letter-spacing:-0.03em">LUCID</span>
<span class="mono">Lock-up: wordmark in an ink pill, top-left of every glass shell.</span>
</div></div></body></html>
